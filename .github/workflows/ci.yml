name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Provision STT models
        run: bash scripts/provision-stt.sh
      - name: Run gates
        run: bash scripts/ci.sh
