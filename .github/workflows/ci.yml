name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install runtime tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg age
      - name: Install omp (pinned)
        run: |
          curl -fsSL https://bun.sh/install | bash
          export PATH="$HOME/.bun/bin:$PATH"
          # omp 18.1.19 ships as the npm package @oh-my-pi/pi-coding-agent.
          # Verified: registry + `omp --version` (see docs/research-plan.md §2.2).
          npm install -g @oh-my-pi/pi-coding-agent@18.1.19
          omp --version
      - name: Provision STT models
        run: bash scripts/provision-stt.sh
      - name: Run gates
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bash scripts/ci.sh
